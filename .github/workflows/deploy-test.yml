name: Build and Deploy Front-End App

on:
    push:
        branches:
            - main
            - "feature/tailwind-v3-migration" # <-- Nom de votre branche de test

jobs:
    build_and_deploy_front:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # ===============================================================
            # ÉTAPE DE BUILD ET PUSH POUR LA PRODUCTION (branche main)
            # ===============================================================
            - name: Build and push PROD Docker image
              if: github.ref == 'refs/heads/main'
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: |
                      lorainep/citydo:latest
                      lorainep/citydo:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: | # Utilise les secrets de PRODUCTION
                      VITE_FETCH_URL=${{ secrets.VITE_FETCH_URL }}
                      VITE_APP_URL=${{ secrets.VITE_APP_URL }}
                      VITE_STORE_KEY=${{ secrets.VITE_STORE_KEY }}
                      VITE_DOMAIN=${{ secrets.VITE_DOMAIN }}
                      VITE_WS_URL=${{ secrets.VITE_WS_URL }}

            # ===============================================================
            # ÉTAPE DE BUILD ET PUSH POUR LE TEST (branche feature)
            # ===============================================================
            - name: Build and push TEST Docker image
              # La condition est mise à jour avec le nom de votre branche
              if: github.ref == 'refs/heads/feature/tailwind-v3-migration'
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  # On utilise un tag clair qui correspond à la branche
                  tags: lorainep/citydo:tailwind-migration-test
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: | # Utilise les secrets de TEST
                      VITE_FETCH_URL=${{ secrets.VITE_FETCH_URL }}
                      VITE_APP_URL=${{ secrets.VITE_APP_URL }}
                      VITE_STORE_KEY=${{ secrets.VITE_STORE_KEY }}
                      VITE_DOMAIN=${{ secrets.VITE_DOMAIN }}
                      VITE_WS_URL=${{ secrets.VITE_WS_URL }}

            # ===============================================================
            # DÉPLOIEMENT
            # ===============================================================
            - name: Trigger Portainer Deploy Webhook (Production)
              if: github.ref == 'refs/heads/main'
              run: curl -s -X POST ${{ secrets.PORTAINER_WEBHOOK_URL_TEST }}

            - name: Trigger Portainer Deploy Webhook (Test)
              # La condition est aussi mise à jour ici
              if: github.ref == 'refs/heads/feature/tailwind-v3-migration'
              run: curl -s -X POST ${{ secrets.PORTAINER_WEBHOOK_URL_TEST }}
